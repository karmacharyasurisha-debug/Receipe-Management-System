<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Recipe - RecipeHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo"> RecipeHub</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="add-recipe.html">Add Recipe</a></li>
           <li><a href="login.html">Logout</a></li>

    </ul>
  </nav>

  <div class="form-page">
    <h1>Add a New Recipe</h1>

   <form id="addRecipeForm">

  <div class="form-group">
    <label for="title">Recipe Title</label>
    <input 
      type="text" 
      id="title" 
      placeholder="e.g. Vegetable Momo" 
      required
    >
  </div>

  <div class="form-group">
    <label for="category">Category</label>
    <select id="category" required>
      <option value="">Select a category</option>
      <option value="breakfast">Breakfast</option>
      <option value="lunch">Lunch</option>
      <option value="dinner">Dinner</option>
      <option value="dessert">Dessert</option>
    </select>
  </div>

  <!-- Image URL -->
  <div class="form-group">
    <label for="image">Image URL</label>
    <input 
      type="url" 
      id="image" 
      placeholder="https://example.com/food.jpg"
      required
    >
  </div>

  <!-- Preparation Time -->
  <div class="form-group">
    <label for="preparationTime">Preparation Time</label>
    <input 
      type="text" 
      id="preparationTime" 
      placeholder="e.g. 30 minutes"
      required
    >
  </div>

  <!-- Serving -->
  <div class="form-group">
    <label for="serving">Serving</label>
    <input 
      type="number" 
      id="serving" 
      placeholder="e.g. 4"
      min="1"
      required
    >
  </div>

  <div class="form-group">
    <label for="ingredients">Ingredients (one per line)</label>
    <textarea 
      id="ingredients" 
      rows="5" 
      placeholder="2 cups flour&#10;1 tsp salt&#10;..."
      required
    ></textarea>
  </div>

  <div class="form-group">
    <label for="steps">Steps (one per line)</label>
    <textarea 
      id="steps" 
      rows="5" 
      placeholder="Mix the flour and salt&#10;Knead the dough&#10;..."
      required
    ></textarea>
  </div>

  <button type="submit" class="btn btn-primary">
    Save Recipe
  </button>

</form>
  </div>

  <script src="add-recipe.js"></script>
</body>
</html>
