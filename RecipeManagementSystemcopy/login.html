<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <title>Login - RecipeHub</title>
  </head>
  <body>
    <div class="page">

      <div class="left-panel">

        <h1>Your Recipes, All in One Place</h1>
        <p class="subtitle">Login to manage your recipes</p>

        <form id="login">
          <input type="text" id="username" placeholder="Username" />
          <span class="error" id="usernameError"></span>

          <input type="password" id="password" placeholder="Password" />
          <span class="error" id="passwordError"></span>

          <button type="submit">Log in</button>
        </form>

        <p class="register-text">Don't have an account? <a href="register.html">Register</a></p>
      </div>

      <div class="right-panel">
        <img src="https://img.magnific.com/free-photo/top-view-fast-food-mix-mozzarella-sticks-club-sandwich-hamburger-mushroom-pizza-caesar-shrimp-salad-french-fries-ketchup-mayo-cheese-sauces-table_141793-3998.jpg?semt=ais_hybrid&w=740&q=80" alt="Food">
      </div>

    </div>

    <script src="login.js"></script>
  </body>
</html>
