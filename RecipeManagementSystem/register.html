<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="register.css" />
    <title>Register - RecipeHub</title>
  </head>
  <body>
    <div class="page">

      <div class="left-panel">

        <h1>Create Your Account</h1>
        <p class="subtitle">Join us and start sharing your favourite recipes</p>

        <form id="register">
          <input type="text" id="name" placeholder="Full Name" />
          <span class="error" id="nameError"></span>

          <input type="text" id="username" placeholder="Username" />
          <span class="error" id="usernameError"></span>

          <input type="password" id="password" placeholder="Password" />
          <span class="error" id="passwordError"></span>

          <input type="password" id="confirmPassword" placeholder="Confirm Password" />
          <span class="error" id="confirmPasswordError"></span>

          <button type="submit">Register</button>
        </form>

        <p class="register-text">Already have an account? <a href="login.html">Login</a></p>
      </div>

      <div class="right-panel">
        <img src="https://img.magnific.com/free-photo/top-view-fast-food-mix-mozzarella-sticks-club-sandwich-hamburger-mushroom-pizza-caesar-shrimp-salad-french-fries-ketchup-mayo-cheese-sauces-table_141793-3998.jpg?semt=ais_hybrid&w=740&q=80" alt="Food">
      </div>

    </div>

    <script src="register.js"></script>
  </body>
</html>
